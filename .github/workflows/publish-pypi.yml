# Publishes to PyPI on version tags via trusted publishing (OIDC): no API
# token is stored anywhere. Requires a one-time PyPI-side registration of
# this repository and workflow as a (pending) trusted publisher for the
# labgrid-tui project, environment "pypi". workflow_dispatch allows a run
# against an existing tag: check the tag out with the ref input.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # Pinned: ubuntu-latest migrates to new LTS images on GitHub's schedule.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # hatch-vcs derives the version from the tag
      # setup-uv publishes no major tag after v7, so the version is an
      # exact pin and moves by hand.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # The auto default already skips caching on tag pushes; this
          # covers workflow_dispatch too, where a release build is too
          # rare to gain anything from a cache.
          enable-cache: false
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write  # OIDC for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
