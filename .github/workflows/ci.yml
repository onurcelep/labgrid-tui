name: ci
on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a newer push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned: ubuntu-latest migrates to new LTS images on GitHub's schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # setup-uv publishes no major tag after v7, so the version is an
      # exact pin and moves by hand.
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      coordinator:
        image: docker.io/labgrid/coordinator:latest
        ports:
          - 20408:20408
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # checks saves a cache under an identical key, so the upload from
          # here is redundant. Restoring is unaffected.
          save-cache: false
      - run: uv sync
      - run: uv run pytest -m integration -v
        env:
          LABGRID_TUI_TEST_COORDINATOR: 127.0.0.1:20408
