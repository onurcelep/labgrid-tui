name: ci
on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a newer push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      coordinator:
        image: docker.io/labgrid/coordinator:latest
        ports:
          - 20408:20408
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run pytest -m integration -v
        env:
          LABGRID_TUI_TEST_COORDINATOR: 127.0.0.1:20408
